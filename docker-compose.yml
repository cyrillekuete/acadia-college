services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
      target: development
    container_name: acadia-college-app
    restart: unless-stopped
    ports:
      - '3000:3000'
    env_file:
      - .env.local
    environment:
      NODE_ENV: development
      NEXT_TELEMETRY_DISABLED: '1'
      WATCHPACK_POLLING: 'true'
      CHOKIDAR_USEPOLLING: 'true'
    volumes:
      - .:/app
      - acadia_node_modules:/app/node_modules
    command: npm run dev -- --hostname 0.0.0.0 --port 3000

volumes:
  acadia_node_modules:
